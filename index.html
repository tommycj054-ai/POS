<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POS V12</title>


<link rel="stylesheet" href="style.css">


<script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>


</head>


<body>


<header>

<h1>POS</h1>

</header>



<main>



<!-- ==========================
DASHBOARD
========================== -->


<section id="dashboard" class="page active">


<h2>Dashboard</h2>



<div class="cards">


<div class="card">

<h3>Products</h3>

<p id="productCount">0</p>

</div>



<div class="card">

<h3>Stock</h3>

<p id="inventoryCount">0</p>

</div>



<div class="card">

<h3>Low Stock</h3>

<p id="lowStock">0</p>

</div>



<div class="card">

<h3>Sold</h3>

<p id="itemsSold">0</p>

</div>



</div>





<div class="quick-buttons">


<button class="nav-button" data-page="checkout">

🛒 Checkout

</button>



<button class="nav-button" data-page="inventory">

📦 Inventory

</button>



<button class="nav-button" data-page="addProduct">

➕ Add Product

</button>



<button class="nav-button" data-page="scanner">

📷 Scanner

</button>



</div>







<div class="dashboard-box">


<h2>⚠️ Low Stock</h2>


<div id="lowStockList"></div>


</div>







<div class="dashboard-box">


<h2>⭐ Best Sellers</h2>


<div id="bestSellers"></div>


</div>





</section>









<!-- ==========================
CHECKOUT
========================== -->


<section id="checkout" class="page">


<h2>Checkout</h2>




<div class="scanner-box">


<h3>Bluetooth Barcode Scanner</h3>


<input

id="checkoutScanner"

placeholder="Scan barcode..."

autocomplete="off"

>


</div>






<div id="categoryButtons"></div>





<div class="checkout-layout">





<div id="products" class="product-grid"></div>







<div class="cart">


<h2>Cart</h2>



<div id="cartItems"></div>





<h2>

$

<span id="total">

0.00

</span>


</h2>






<button id="clearCart">

Clear Cart

</button>






<button id="cashPay" class="black">

💵 Cash

</button>






<button id="cardPay" class="black">

💳 Card

</button>





</div>






</div>


</section>









<!-- ==========================
ADD PRODUCT
========================== -->


<section id="addProduct" class="page">


<h2>Add Product</h2>





<input

id="productName"

placeholder="Product Name"

>






<input

id="productPrice"

type="number"

placeholder="Price"

>






<input

id="productStock"

type="number"

placeholder="Stock"

>






<select id="productCategory">


</select>






<input

id="productBarcode"

placeholder="Barcode"

>






<button id="generateBarcode">

Generate Barcode

</button>






<input

id="productImage"

type="file"

accept="image/*"

>






<button id="saveProduct">

Save Product

</button>




</section>
<!-- ==========================
EDIT PRODUCT
========================== -->


<section id="editProduct" class="page">


<h2>Edit Product</h2>



<input
id="editName"
placeholder="Product Name"
>




<input
id="editPrice"
type="number"
placeholder="Price"
>




<input
id="editStock"
type="number"
placeholder="Stock"
>




<select id="editCategory">

</select>





<button id="updateProduct">

Save Changes

</button>



</section>








<!-- ==========================
INVENTORY
========================== -->


<section id="inventory" class="page">


<h2>📦 Inventory</h2>



<div id="inventoryList"></div>



</section>









<!-- ==========================
CAMERA SCANNER
========================== -->


<section id="scanner" class="page">


<h2>📷 Barcode Scanner</h2>




<select id="scanMode">


<option value="checkout">

Add To Cart

</option>



<option value="add">

Add +1 Stock

</option>



<option value="remove">

Remove -1 Stock

</option>



</select>







<div id="cameraScanner"></div>





<button id="startCamera">

Start Camera

</button>





<button id="stopCamera">

Stop Camera

</button>







<h3>

Bluetooth Scanner

</h3>





<input

id="inventoryScanner"

placeholder="Scan barcode..."

autocomplete="off"

>






<div id="scanResult"></div>




</section>









<!-- ==========================
BARCODE LABELS
========================== -->


<section id="barcodes" class="page">


<h2>🖨 Barcode Labels</h2>





<div class="barcode-controls">





<select id="labelSize">



<option value="small">

2 x 1 inch

</option>



<option value="medium">

2.625 x 1 inch

</option>



<option value="large">

3.33 x 2 inch

</option>



<option value="full">

Full Page

</option>



</select>








<button id="selectAllBarcodes">

☑ Select All

</button>






<button id="clearBarcodeSelection">

Clear

</button>






<button id="printSelected">

Print Selected

</button>






<button id="printAll">

Print All

</button>






</div>







<div id="barcodeList"></div>



<div id="printArea"></div>




</section>









<!-- ==========================
CATEGORIES
========================== -->


<section id="categories" class="page">



<h2>⚙️ Categories</h2>






<input

id="categoryName"

placeholder="New Category"

>





<button id="addCategory">

Add Category

</button>







<div id="categoryList"></div>





</section>









<!-- ==========================
SALES HISTORY
========================== -->


<section id="sales" class="page">



<h2>🧾 Sales History</h2>





<div id="salesList"></div>






<button id="clearSales">

Clear Sales

</button>





</section>






</main>









<!-- ==========================
BOTTOM NAVIGATION
========================== -->


<nav>


<button class="nav-button" data-page="dashboard">

⌂

</button>



<button class="nav-button" data-page="checkout">

🛒

</button>



<button class="nav-button" data-page="scanner">

📷

</button>



<button class="nav-button" data-page="inventory">

📦

</button>



<button class="nav-button" data-page="barcodes">

🖨

</button>



<button class="nav-button" data-page="categories">

⚙️

</button>



<button class="nav-button" data-page="sales">

🧾

</button>



</nav>







<script src="app.js"></script>



</body>

</html>
